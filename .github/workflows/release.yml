name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v2.*.*'

permissions:
  contents: write

jobs:
  version:
    name: Create version tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags

      - name: Generate next tag
        id: version
        shell: bash
        run: |
          month_year="$(date +%m%y)"
          latest_tag="$(git tag -l "v2.${month_year}.*" | sort -V | tail -n 1)"
          if [ -n "$latest_tag" ]; then
            latest_number="${latest_tag##*.}"
          else
            latest_number=0
          fi

          next_number=$((latest_number + 1))
          version_tag="v2.${month_year}.${next_number}"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version_tag }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.version.outputs.version_tag }}"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    needs: [version]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    env:
      RELEASE_VERSION: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.version_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs_on: windows-latest
            goos: windows
            goarch: amd64
            artifact_prefix: went-windows-amd64
          - name: linux
            runs_on: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_prefix: went-linux-amd64
          - name: linux-arm64
            runs_on: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_prefix: went-linux-arm64
          - name: macos
            runs_on: macos-latest
            goos: darwin
            goarch: amd64
            artifact_prefix: went-darwin-amd64
          - name: macos-arm64
            runs_on: macos-latest
            goos: darwin
            goarch: arm64
            artifact_prefix: went-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        id: build
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          version="${RELEASE_VERSION#v}"
          artifact_name="${{ matrix.artifact_prefix }}-v.${version}"
          if [ "$GOOS" = "windows" ]; then
            artifact_name="${artifact_name}.exe"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          go build -trimpath -ldflags="-s -w -X went/internal/utils.CurrentVersion=${RELEASE_VERSION}" -o "dist/$artifact_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: dist/${{ steps.build.outputs.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    env:
      RELEASE_VERSION: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.version_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      - name: Set up Rust
        uses: rust-lang/setup-rust@v1
        with:
          toolchain: stable

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          git fetch --prune --unshallow || true
          git cliff --config .gitcliff.toml --output CHANGELOG.md --tag "${RELEASE_VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: CHANGELOG.md
          files: dist/*
