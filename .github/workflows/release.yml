name: Release

on:
  push:
    tags:
      - 'v1.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs_on: windows-latest
            goos: windows
            goarch: amd64
            artifact_prefix: went2-windows-amd64
          - name: linux
            runs_on: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_prefix: went2-linux-amd64
          - name: linux-arm64
            runs_on: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_prefix: went2-linux-arm64
          - name: macos
            runs_on: macos-latest
            goos: darwin
            goarch: amd64
            artifact_prefix: went2-darwin-amd64
          - name: macos-arm64
            runs_on: macos-latest
            goos: darwin
            goarch: arm64
            artifact_prefix: went2-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        id: build
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          version="${RELEASE_VERSION#v}"
          artifact_name="${{ matrix.artifact_prefix }}-v.${version}"
          if [ "$GOOS" = "windows" ]; then
            artifact_name="${artifact_name}.exe"
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          go build -trimpath -ldflags="-s -w" -o "dist/$artifact_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: dist/${{ steps.build.outputs.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
